## ONLY FOR TEST AND PROP FILE CHECK ##
bikcache.file.mark=bikcache

############### Broadcast configuration #######################
# Cache Broadcast Method (redis/lettuce/none)
j2cache.broadcast = redis
j2cache.broadcast.channel = channel.io.bikcache
###############################################################


############### L1&2 Cache configuration ######################
# Level 1&2 provider (lettuce|redisson)
j2cache.L1.provider_class = caffeine
j2cache.L2.provider_class = redis

j2cache.L2.key_namespace = namespace.io.bikcache
j2cache.L2.sync_access = false

# Enable/Disable ttl in redis cache data (if disabled, the object in redis will never expire, default:true)
j2cache.sync_ttl_to_redis = true

# Whether to cache null objects by default (default false)
j2cache.default_cache_null_object = true
# The TTL of cached null objects, default is 300 seconds
j2cache.default_null_object_ttl = 300

# for LocalCache: When L1 cache expired, auto evict L2 cache (true|false, default:false)
j2cache.L1.expired_evictL2 = false

# Cache Serialization Provider (fst|kryo|json|fastjson|java|fse)
j2cache.serialization = fastjson
###############################################################


############### Calibrate configuration #######################
# Calibrate parameters
j2cache.calibrate.range_millis = 86400
j2cache.calibrate.margin_millis = 60
j2cache.calibrate.service_namespace = bitkernel.high_availability.programming.loginApplication
j2cache.calibrate.timestamp_save_ttl = 2592000


############### Cache TTL configuration #######################
j2cache.region.properties = /bikcache-ttl.properties
j2cache.L2.config_section = l2redis


############### L2 cache configuration ########################
# redis mode (single|master-replica)
l2redis.mode = single
l2redis.scheme = redis
l2redis.hosts = 127.0.0.1:6379
l2redis.password =
l2redis.database = 0
l2redis.maxTotal = 1000
l2redis.maxIdle = 10
l2redis.minIdle = 10
# timeout in milliseconds
l2redis.timeout = 10000
###############################################################
## for lettuce
# redis cluster topology refresh interval in milliseconds
l2redis.clusterTopologyRefresh = 3000
# redis command scan parameter count, default[1000]
l2redis.scanCount = 1000
# storage mode (generic|hash)
l2redis.storage = generic
l2redis.sentinelMasterId =
l2redis.sentinelPassword =
###############################################################
## for redisson
l2redis.masterName = mymaster
###############################################################
## jedis pool properties, used by broadcast
l2redis.maxWaitMillis = 5000
l2redis.minEvictableIdleTimeMillis = 60000
l2redis.numTestsPerEvictionRun = 10
l2redis.lifo = false
l2redis.softMinEvictableIdleTimeMillis = 10
l2redis.testOnBorrow = true
l2redis.testOnReturn = false
l2redis.testWhileIdle = true
l2redis.timeBetweenEvictionRunsMillis = 300000
l2redis.blockWhenExhausted = false
l2redis.jmxEnabled = false
###############################################################


##################################################################################
db.host = 127.0.0.1
db.inst = mysql
db.username = root
db.password = 1234
db.maxActive = 50
db.minIdle = 10
db.idleTimeout = 60000
db.txTimeout = 1800
